[project]
name = "data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "renandwight", email = "inc3ndi4ry@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytz>=2026.5",
]

[project.scripts]
data-platform = "data_platform:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
