services:
  polaris:
    image: apache/polaris:1.8.0
    container_name: data-platform-polaris
    restart: unless-stopped

    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"

    environment:
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      POLARIS_REALM_CONTEXT_REQUIRE_HEADER: "true"

      QUARKUS_OTEL_SDK_DISABLED: "true"

      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql

      QUARKUS_DATASOURCE_USERNAME: polaris_user
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://172.18.0.1:5432/polaris?currentSchema=polaris_schema

      POLARIS_AUTHENTICATION_TOKEN_BROKER_RSA_KEY_PAIR_PUBLIC_KEY_FILE: /etc/polaris/keys/public.pem
      POLARIS_AUTHENTICATION_TOKEN_BROKER_RSA_KEY_PAIR_PRIVATE_KEY_FILE: /etc/polaris/keys/private.pem

      AWS_ACCESS_KEY_ID: ${POLARIS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${POLARIS_S3_SECRET_KEY}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"

    volumes:
      - ./polaris/keys:/etc/polaris/keys:ro

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    profiles:
      - setup
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql

      QUARKUS_DATASOURCE_USERNAME: polaris_user
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://172.18.0.1:5432/polaris?currentSchema=polaris_schema

      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - 'exec java -jar /deployments/polaris-admin-tool.jar bootstrap -r POLARIS -c "POLARIS,root,$$POLARIS_CLIENT_SECRET"'